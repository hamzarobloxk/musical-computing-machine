<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #090A0F; --surface: #0D0E14; --raised: #12141b; --line: #1e2029; --line-strong: #30333f;
    --fg: #EDEDED; --muted: #8C8E9A; --accent: #3b82f6;
    --font-sans: 'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--fg); font-family: var(--font-sans); line-height: 1.55; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; }
  a { color: inherit; text-decoration: none; }
  h1, h2, h3, p, ul { margin: 0; }
  ul { padding: 0; list-style: none; }
  button { font-family: inherit; }

  .hidden { display: none !important; }
  .wrap { width: 100%; max-width: 1280px; margin-inline: auto; padding-inline: max(16px, env(safe-area-inset-left, 0px)); }
  .eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

  header { border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20; background: rgba(9,10,15,.85); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
  header .wrap { display: flex; align-items: center; justify-content: space-between; height: 60px; }
  .brand { display: inline-flex; align-items: center; gap: 10px; font-weight: 500; letter-spacing: -.01em; }
  .back { font-size: 14px; color: var(--muted); transition: color .2s; }
  .back:hover { color: var(--fg); }
  .topbar { display: flex; align-items: center; gap: 12px; }
  .who { font-size: 13px; color: var(--muted); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pill-btn { height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-strong); background: transparent; color: var(--fg); font: 500 13px var(--font-sans); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .pill-btn:hover { border-color: rgba(237,237,237,.45); background: rgba(237,237,237,.04); }

  /* auth cards */
  #authMain { flex: 1; display: grid; place-items: center; padding: 40px 16px; }
  .card { width: 100%; max-width: 420px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 16px; padding: 32px 28px; }
  .card h1 { margin-top: 10px; font-size: 1.75rem; letter-spacing: -.03em; font-weight: 500; }
  .lead { margin-top: 8px; color: var(--muted); font-size: 15px; }
  label { display: block; margin-top: 18px; font-size: 13px; color: var(--muted); }
  input[type=text], input[type=email], input[type=password], input[type=number], input[type=url] {
    width: 100%; height: 44px; margin-top: 6px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line-strong);
    background: var(--bg); color: var(--fg); font: 400 15px var(--font-sans);
  }
  input:focus { border-color: var(--accent); outline: none; }
  .btn { display: inline-flex; align-items: center; justify-content: center; height: 44px; padding: 0 24px; border-radius: 999px; border: 1px solid var(--line-strong); font: 500 15px var(--font-sans); cursor: pointer; transition: background .2s, border-color .2s; color: var(--fg); background: transparent; }
  .btn.block { display: flex; width: 100%; margin-top: 22px; }
  .btn--primary { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .btn--primary:hover { background: #fff; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn--ghost:hover { border-color: rgba(237,237,237,.45); background: rgba(237,237,237,.04); }
  .btn--sm { height: 36px; padding: 0 16px; font-size: 14px; }
  .msg { margin-top: 14px; font-size: 13px; min-height: 18px; color: var(--muted); }
  .msg.err { color: #f87171; } .msg.ok { color: #4ade80; }
  .linkbtn { background: none; border: 0; padding: 0; margin-top: 16px; color: var(--muted); font: 400 13px var(--font-sans); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .linkbtn:hover { color: var(--fg); }
  .sep { display: flex; align-items: center; gap: 12px; margin: 22px 0 14px; color: var(--muted); font-size: 12px; }
  .sep::before, .sep::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  /* app shell */
  #appWrap { flex: 1; width: 100%; max-width: 1280px; margin-inline: auto; display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 32px; padding: 28px max(16px, env(safe-area-inset-right, 0px)) 64px max(16px, env(safe-area-inset-left, 0px)); }
  nav.side { position: sticky; top: 88px; align-self: start; display: flex; flex-direction: column; gap: 2px; }
  nav.side a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; font-size: 14px; color: var(--muted); transition: background .15s, color .15s; border: 1px solid transparent; }
  nav.side a:hover { color: var(--fg); background: rgba(237,237,237,.04); }
  nav.side a[aria-current=page] { color: var(--fg); background: rgba(59,130,246,.1); border-color: rgba(59,130,246,.35); }
  nav.side svg { flex: none; }
  nav.side a.call { margin-top: 14px; color: var(--bg); justify-content: center; background: var(--fg); }
  nav.side a.call:hover { background: #fff; color: var(--bg); }

  .banner.live { border-color: rgba(74,222,128,.4); background: rgba(74,222,128,.06); }
  .banner.pending { border-color: rgba(251,191,36,.4); background: rgba(251,191,36,.06); }
  .banner b { font-weight: 500; }

  .metric { border: 1px solid var(--line-strong); background: var(--surface); border-radius: 14px; padding: 18px; }
  .metric .v { margin-top: 8px; font-size: 1.7rem; letter-spacing: -.03em; font-weight: 500; font-variant-numeric: tabular-nums; }
  .metric .h { margin-top: 2px; font-size: 12px; color: var(--muted); }
  .panel { margin-top: 18px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 16px; padding: 22px; }
  .panel h2 { font-size: 1.1rem; font-weight: 500; letter-spacing: -.02em; }
  .panel .sub { margin-top: 2px; font-size: 14px; color: var(--muted); }

  .bars { margin-top: 16px; display: grid; gap: 12px; }
  .bar .row { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 5px; }
  .bar .row b { color: var(--fg); font-weight: 500; font-variant-numeric: tabular-nums; }
  .bar .track { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .bar .fill { height: 100%; border-radius: 99px; background: var(--accent); }
  .bar .fill.done { background: #4ade80; }
  .list { margin-top: 12px; }
  .list li { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .list li:last-child { border-bottom: 0; }
  .list .m { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .empty { padding: 22px 0 6px; text-align: center; color: var(--muted); font-size: 14px; }

  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line-strong); font-size: 12px; color: var(--muted); white-space: nowrap; }
  .badge.live { color: #93c5fd; border-color: rgba(59,130,246,.5); background: rgba(59,130,246,.08); }
  .badge.done { color: #4ade80; border-color: rgba(74,222,128,.4); background: rgba(74,222,128,.07); }

  .tablewrap { overflow-x: auto; margin-top: 14px; }
  table { width: 100%; min-width: 560px; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font: 500 11px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); padding: 10px 12px; border-bottom: 1px solid var(--line-strong); }
  td { padding: 12px; border-bottom: 1px solid var(--line); }
  tr.click { cursor: pointer; } tr.click:hover td { background: rgba(237,237,237,.03); }
  tr:last-child td { border-bottom: 0; }

  .seg { display: inline-flex; padding: 3px; border: 1px solid var(--line-strong); border-radius: 10px; }
  .seg button { height: 30px; padding: 0 14px; border: 0; border-radius: 7px; background: transparent; color: var(--muted); font: 500 13px var(--font-sans); cursor: pointer; }
  .seg button[aria-pressed=true] { background: var(--accent); color: #fff; }

  /* kanban */
  .board { display: flex; gap: 14px; overflow-x: auto; padding-bottom: 14px; scroll-snap-type: x proximity; }
  .col { flex: 0 0 272px; scroll-snap-align: start; border: 1px solid var(--line); background: rgba(13,14,20,.7); border-radius: 14px; padding: 12px; }
  .col-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; padding: 2px 4px 10px; }
  .col-head h3 { font: 500 11px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .col-head .tot { margin-top: 2px; font-size: 12px; color: #5d606c; font-variant-numeric: tabular-nums; }
  .deal { display: block; width: 100%; text-align: left; padding: 12px; margin-top: 8px; border: 1px solid var(--line-strong); background: var(--raised); border-radius: 12px; color: var(--fg); cursor: pointer; transition: border-color .15s; }
  .deal:hover { border-color: rgba(59,130,246,.6); }
  .deal .n { font-weight: 500; font-size: 14px; }
  .deal .p { margin-top: 2px; font-size: 12px; color: var(--muted); }
  .deal .f { margin-top: 10px; display: flex; justify-content: space-between; font-size: 13px; font-variant-numeric: tabular-nums; }
  .deal .f span:last-child { color: var(--muted); font-size: 12px; }
  .col .none { margin-top: 8px; padding: 14px 8px; border: 1px dashed var(--line); border-radius: 10px; text-align: center; font-size: 12px; color: #5d606c; }

  /* drawer */
  .scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.6); opacity: 0; pointer-events: none; transition: opacity .25s; }
  .scrim.open { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; inset: 0 0 0 auto; z-index: 50; width: min(480px, 100%); display: flex; flex-direction: column; background: var(--surface); border-left: 1px solid var(--line-strong); transform: translateX(100%); visibility: hidden; transition: transform .3s cubic-bezier(.2,.8,.2,1), visibility 0s .3s; }
  .drawer.open { transform: none; visibility: visible; transition: transform .3s cubic-bezier(.2,.8,.2,1), visibility 0s; }
  .drawer-head { display: flex; justify-content: space-between; gap: 12px; padding: 20px; border-bottom: 1px solid var(--line); }
  .drawer-head h2 { font-size: 1.3rem; font-weight: 500; letter-spacing: -.02em; margin-top: 4px; }
  .drawer-body { flex: 1; overflow-y: auto; padding: 20px; display: grid; gap: 22px; align-content: start; }
  .drawer h3 { font: 500 11px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 8px; }
  .xbtn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line-strong); background: transparent; color: var(--fg); cursor: pointer; display: grid; place-items: center; flex: none; }
  .xbtn:hover { border-color: rgba(237,237,237,.45); }
  .msgbox { padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--raised); margin-bottom: 8px; }
  .msgbox .t { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .msgbox .t b { color: var(--fg); font-weight: 500; }
  .msgbox p { margin-top: 4px; font-size: 14px; color: #cfd0d6; white-space: pre-wrap; }
  .doc { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 10px; font-size: 14px; margin-bottom: 8px; }
  .doc:hover { border-color: var(--accent); }
  .doc span:last-child { color: var(--accent); font-size: 12px; }
  .note { font-size: 13px; color: var(--muted); }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  textarea { width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--bg); color: var(--fg); font: 400 15px/1.5 var(--font-sans); resize: vertical; }
  textarea:focus { border-color: var(--accent); outline: none; }
  .replybar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 8px; }
  .replybar .msg { margin: 0; flex: 1; }
  .msgbox.me { border-color: rgba(59,130,246,.45); background: rgba(59,130,246,.07); }

  /* forms */
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 16px; }
  .fieldset { margin-top: 22px; padding-top: 6px; border-top: 1px solid var(--line); }
  .fieldset h3 { margin-top: 14px; font: 500 11px var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

  /* vault */
  .vault { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
  .vault .panel { margin-top: 0; }
  .drop { margin-top: 14px; padding: 22px 14px; border: 1.5px dashed var(--line-strong); border-radius: 12px; text-align: center; color: var(--muted); font-size: 14px; cursor: pointer; transition: border-color .15s, background .15s; }
  .drop:hover, .drop.over { border-color: var(--accent); background: rgba(59,130,246,.06); color: var(--fg); }
  .drop small { display: block; margin-top: 2px; font-size: 12px; color: #5d606c; }
  .file { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  .file:last-child { border-bottom: 0; }
  .file .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file .sz { color: var(--muted); font-size: 12px; margin-left: 8px; }
  .file .acts { display: flex; gap: 6px; flex: none; }
  .mini { height: 28px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line-strong); background: transparent; color: var(--fg); font: 500 12px var(--font-sans); cursor: pointer; }
  .mini:hover { border-color: rgba(237,237,237,.45); }
  .mini.danger:hover, .mini.confirm { border-color: #f87171; color: #f87171; }

  /* tags / wishlist */
  .tags { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; border: 1px solid var(--line-strong); border-radius: 10px; background: var(--bg); min-height: 46px; align-items: center; }
  .tags:focus-within { border-color: var(--accent); }
  .tags input { flex: 1; min-width: 140px; height: 30px; margin: 0; border: 0; background: transparent; padding: 0 6px; color: var(--fg); font: 400 15px var(--font-sans); }
  .tags input:focus { outline: none; }
  .tag { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 6px 0 12px; border-radius: 999px; background: rgba(59,130,246,.12); border: 1px solid rgba(59,130,246,.4); font-size: 13px; }
  .tag.red { background: rgba(248,113,113,.1); border-color: rgba(248,113,113,.4); }
  .tag button { width: 18px; height: 18px; border: 0; border-radius: 50%; background: transparent; color: inherit; cursor: pointer; line-height: 1; font-size: 14px; }
  .tag button:hover { background: rgba(237,237,237,.15); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { height: 28px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line-strong); background: transparent; color: var(--muted); font: 400 13px var(--font-sans); cursor: pointer; }
  .chip:hover { color: var(--fg); border-color: rgba(237,237,237,.45); }
  .checks { margin-top: 10px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .check { display: flex; align-items: center; gap: 10px; margin: 0; padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: 10px; color: var(--fg); font-size: 14px; cursor: pointer; }
  .check input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
  .check:has(input:checked) { border-color: rgba(59,130,246,.6); background: rgba(59,130,246,.08); }
  .count { float: right; font-family: var(--font-mono); font-size: 12px; }

  footer { border-top: 1px solid var(--line); padding: 20px 0; font-size: 13px; color: var(--muted); }

  @media (max-width: 960px) {
    #appWrap { grid-template-columns: minmax(0, 1fr); gap: 18px; padding-top: 16px; }
    nav.side { position: static; flex-direction: row; overflow-x: auto; gap: 6px; padding-bottom: 6px; border-bottom: 1px solid var(--line); margin-inline: -4px; }
    nav.side a { flex: none; padding: 9px 12px; }
    nav.side .call { margin-top: 0; }
    .metrics { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 720px) {
    .two, .vault, .grid2, .checks { grid-template-columns: minmax(0, 1fr); }
    .who { display: none; }
    .col { flex-basis: 82vw; }
    .page-head h1 { font-size: 1.6rem; }
  }
  @media (prefers-reduced-motion: reduce) { .drawer, .scrim { transition: none; } }
</style>
<style>

  .tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); margin: 22px 0 20px; overflow-x: auto; }

  .conv .who { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .conv .snip { margin-top: 6px; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  select, input[type=date] { width: 100%; height: 44px; margin-top: 6px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--line-strong); background: var(--bg); color: var(--fg); font: 400 15px var(--font-sans); }
  td select { height: 34px; margin: 0; font-size: 13px; width: auto; min-width: 150px; }
  .modal { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 16px; background: rgba(0,0,0,.65); }

    $('mTitle').textContent = d ? 'Edit deal' : 'Add deal';
    $('f_brand').value = d ? d.brand : ''; $('f_pkg').value = d && d.package ? d.package : 'Dedicated Video';
    $('f_value').value = d && d.value != null ? d.value : ''; $('f_stage').value = d ? d.stage : 'pitch';
    $('f_air').value = d && d.air_date ? d.air_date : ''; $('f_brief').value = d && d.brief ? d.brief : '';
    $('f_docs').value = d && Array.isArray(d.docs) ? d.docs.map(function (x) { return (x.label || 'Document') + ' | ' + (x.url || ''); }).join('\n') : '';
    $('delDeal').classList.toggle('hidden', !d); $('delDeal').textContent = 'Delete deal'; $('delDeal').classList.remove('confirm');
    say($('formMsg'), ''); $('modal').classList.remove('hidden'); $('f_brand').focus();
  }
  function closeForm() { $('modal').classList.add('hidden'); }
  $('newDeal').addEventListener('click', function () { openForm(null); });
  $('cancelDeal').addEventListener('click', closeForm);
  $('modal').addEventListener('click', function (e) { if (e.target === $('modal')) closeForm(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('modal').classList.contains('hidden')) closeForm(); });

  $('dealForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var brand = $('f_brand').value.trim();
    if (!brand) { say($('formMsg'), 'Enter a brand name.', 'err'); return; }
    if (!$('f_client').value) { say($('formMsg'), 'Pick a client. Add users in Supabase first.', 'err'); return; }
    var docs = [], bad = false;
    $('f_docs').value.split('\n').forEach(function (line) {
      line = line.trim(); if (!line) return;
      var i = line.lastIndexOf('|'), label = i > -1 ? line.slice(0, i).trim() : 'Document', url = (i > -1 ? line.slice(i + 1) : line).trim();
      if (!/^https?:\/\//i.test(url)) { bad = true; return; }
      docs.push({ label: label || 'Document', url: url });
    });
    if (bad) { say($('formMsg'), 'Each document needs a link starting with https://', 'err'); return; }
    var row = { brand: brand, package: $('f_pkg').value, value: $('f_value').value === '' ? 0 : Number($('f_value').value),
      stage: $('f_stage').value, air_date: $('f_air').value || null, brief: $('f_brief').value.trim() || null, docs: docs };
    $('saveDeal').disabled = true; say($('formMsg'), 'Saving...');
    var q = editing ? sb.from('deals').update(row).eq('id', editing.id) : sb.from('deals').insert(Object.assign({ user_id: $('f_client').value }, row));
    q.then(function (r) {
      $('saveDeal').disabled = false;
      if (r.error) { say($('formMsg'), 'Could not save: ' + r.error.message, 'err'); return; }
      closeForm(); loadAll();
    });
  });
  $('delDeal').addEventListener('click', function () {
    var b = $('delDeal');
    if (!b.classList.contains('confirm')) { b.classList.add('confirm'); b.textContent = 'Click again to delete'; return; }
    sb.from('deals').delete().eq('id', editing.id).then(function (r) { if (r.error) { say($('formMsg'), 'Could not delete.', 'err'); return; } closeForm(); selConv = null; loadAll(); });
  });

  /* ---------- session ---------- */
  sb.auth.onAuthStateChange(function (event, session) {
    if (event === 'SIGNED_OUT') { me = null; entering = false; show('auth'); return; }
    if (session && session.user && (!me || me.id !== session.user.id)) enter(session.user);
  });
  sb.auth.getSession().then(function (r) { if (!r.data.session) show('auth'); else if (!me && !entering) enter(r.data.session.user); });
})();
</script>
</body>
</html>
